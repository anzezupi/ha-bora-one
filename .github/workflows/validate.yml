name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands description topics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - name: Install the Bluetooth libraries pinned by Home Assistant
        run: |
          HA=$(python -c "import importlib.util, os; print(os.path.dirname(importlib.util.find_spec('homeassistant').origin))")
          REQS=$(python -c "import json, sys; print(' '.join(r for c in ('bluetooth', 'bluetooth_adapters') for r in json.load(open(f'$HA/components/{c}/manifest.json')).get('requirements', [])))")
          echo "$REQS"
          pip install $REQS
      - name: Run tests
        run: |
          set -o pipefail
          pytest -v -rfE 2>&1 | tee pytest.log
      - name: Publish test failures as annotation
        if: failure()
        run: |
          python - <<'EOF'
          text = open("pytest.log", encoding="utf-8", errors="replace").read()[-12000:]
          text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          print(f"::error title=pytest::{text}")
          EOF
