name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands description topics

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component
      - name: Install the Bluetooth libraries pinned by Home Assistant
        run: |
          HA=$(python -c "import importlib.util, os; print(os.path.dirname(importlib.util.find_spec('homeassistant').origin))")
          REQS=$(python - "$HA" <<'EOF'
          import json, sys
          seen, reqs, todo = set(), set(), ["bluetooth", "bluetooth_adapters"]
          while todo:
              name = todo.pop()
              if name in seen:
                  continue
              seen.add(name)
              try:
                  manifest = json.load(open(f"{sys.argv[1]}/components/{name}/manifest.json"))
              except FileNotFoundError:
                  continue
              reqs.update(manifest.get("requirements", []))
              todo += manifest.get("dependencies", []) + manifest.get("after_dependencies", [])
          print(" ".join(sorted(reqs)))
          EOF
          )
          echo "$REQS"
          pip install $REQS
      - name: Run tests
        run: |
          set -o pipefail
          pytest -q --tb=short -p no:logging -rfE 2>&1 | tee pytest.log
      - name: Publish test failures as annotation
        if: failure()
        run: |
          python - <<'EOF'
          text = open("pytest.log", encoding="utf-8", errors="replace").read()[-30000:]
          for i in range(0, len(text), 3000):
              part = text[i:i + 3000].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=pytest {i // 3000:02d}::{part}")
          EOF
